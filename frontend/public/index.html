<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LI Punto de Venta</title><link rel="stylesheet" href="/assets/style.css"></head><body><header><strong>LI <span>PUNTO DE VENTA</span></strong><small>Demo local · caja 1 · sucursal 1</small></header><main><section class="catalog"><div class="heading"><h1>Productos</h1><button id="new">+ Agregar producto</button></div><input id="search" placeholder="Buscar por nombre o escanear SKU" autofocus><p id="notice" role="status"></p><div id="products" class="grid"></div><h2>Últimas ventas</h2><div id="sales"></div></section><aside><h2>Venta actual</h2><div id="cart"></div><div class="totals"><div>Subtotal <b id="subtotal">$0.00</b></div><div>IVA 16% <b id="tax">$0.00</b></div><div class="grand">Total <b id="total">$0.00</b></div></div><label>Forma de pago<select id="method"><option value="cash">Efectivo</option><option value="card">Tarjeta (registro manual)</option><option value="transfer">Transferencia (registro manual)</option></select></label><label>Recibido<input type="number" id="paid" min="0" step=".01" placeholder="0.00"></label><button id="charge" class="primary">Confirmar cobro</button><p class="muted">La tarjeta y transferencia se registran manualmente; no se procesan pagos ni CFDI.</p></aside></main><dialog id="dialog"><form method="dialog" id="form"><h2>Nuevo producto</h2><input name="sku" required placeholder="SKU"><input name="name" required placeholder="Nombre"><input name="price" required type="number" min=".01" step=".01" placeholder="Precio sin IVA"><input name="stock" required type="number" min="0" step="1" placeholder="Existencia inicial"><menu><button value="cancel">Cancelar</button><button value="save" class="primary">Guardar</button></menu></form></dialog><script type="module" src="/assets/app.js"></script></body></html>
