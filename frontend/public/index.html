<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LI Punto de Venta</title><link rel="stylesheet" href="/assets/style.css"></head><body><header><strong>LI <span>PUNTO DE VENTA</span></strong><small><span id="who">Sin sesión</span> <button id="logout" hidden>Salir</button></small></header><main><section class="catalog"><div class="heading"><h1>Productos</h1><button id="new">+ Agregar producto</button></div><label>Sucursal<select id="branch"></select></label><input id="search" placeholder="Buscar por nombre o escanear SKU" autofocus><p id="notice" role="status"></p><div id="products" class="grid"></div><section id="transferPanel" hidden><h2>Traspasar inventario</h2><form id="transferForm"><label>Producto de esta sucursal<select id="transferProduct" required></select></label><label>Enviar a sucursal<select id="transferTarget" required></select></label><label>Cantidad<input id="transferQuantity" type="number" min="1" step="1" required></label><button type="submit">Registrar traspaso</button></form></section><h2>Resumen de sucursal</h2><p id="summary"></p><h2>Últimas ventas</h2><div id="sales"></div></section><aside><h2>Caja</h2><p id="cashStatus">Cargando...</p><div id="openControls"><label>Fondo inicial<input id="opening" type="number" min="0" step=".01" value="0"></label><button id="openCash">Abrir caja</button></div><div id="closeControls" hidden><label>Efectivo contado<input id="counted" type="number" min="0" step=".01"></label><label>Retiro de efectivo<input id="withdrawAmount" type="number" min=".01" step=".01" placeholder="Importe"></label><input id="withdrawReason" placeholder="Motivo del retiro"><button id="withdrawCash">Registrar retiro</button><button id="closeCash">Cerrar y contar caja</button></div><h2>Venta actual</h2><label>Buscar cliente<input id="customerSearch" placeholder="Nombre o teléfono"></label><label>Cliente<select id="customer"><option value="">Público general</option></select></label><button id="newCustomer" type="button">+ Registrar cliente</button><button id="editCustomer" type="button">Editar cliente</button><button id="customerHistoryButton" type="button">Ver compras</button><div id="customerHistory" role="status"></div><div id="cart"></div><div class="totals"><div>Subtotal <b id="subtotal">$0.00</b></div><div>IVA 16% <b id="tax">$0.00</b></div><div class="grand">Total <b id="total">$0.00</b></div></div><label>Forma de pago<select id="method"><option value="cash">Efectivo</option><option value="card">Tarjeta (registro manual)</option><option value="transfer">Transferencia (registro manual)</option></select></label><label>Recibido<input type="number" id="paid" min="0" step=".01" placeholder="0.00"></label><button id="charge" class="primary">Confirmar cobro</button><p class="muted">Tarjeta y transferencia se registran manualmente; no se procesan pagos ni CFDI.</p></aside></main><dialog id="dialog"><form method="dialog" id="form"><h2>Nuevo producto</h2><input name="sku" required placeholder="SKU"><input name="name" required placeholder="Nombre"><input name="price" required type="number" min=".01" step=".01" placeholder="Precio sin IVA"><input name="stock" required type="number" min="0" step="1" placeholder="Existencia inicial"><menu><button value="cancel">Cancelar</button><button value="save" class="primary">Guardar</button></menu></form></dialog><dialog id="receiptDialog"><div id="receiptContent"></div><menu><button id="printReceipt" type="button">Imprimir</button><button id="shareReceipt" type="button">Compartir por WhatsApp</button><button id="closeReceipt" type="button">Cerrar</button></menu></dialog><dialog id="loginDialog"><form id="loginForm"><h2>Iniciar sesión</h2><input name="username" autocomplete="username" required placeholder="Usuario"><input name="password" autocomplete="current-password" type="password" required placeholder="Contraseña"><button class="primary">Entrar</button><p id="loginError" role="alert"></p></form></dialog><script type="module" src="/assets/app.js"></script></body></html>
